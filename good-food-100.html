<style>
/* Layout: full-bleed map; phone = bottom sheet list, wide = left side panel. Markers: colour = hats, shape = price. */
:root {
  --bg: #f6f5f2; --surface: #ffffff; --fg: #1d2227; --muted: #626b75; --line: #dcdcd6;
  --accent: #b5452a; --chip: #ecebe6; --chip-on: #1d2227; --chip-on-fg: #ffffff;
  --hat0: #7f8a97; --hat1: #d99a1e; --hat2: #d0572a; --hat3: #8e1b3d; --none: #a9aeb4;
  --pr0: #4f9a5a; --pr1: #d99a1e; --pr2: #d0572a; --pr3: #8e1b3d;
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-quote: "Newsreader", Georgia, "Times New Roman", serif;
  --shadow: 0 6px 24px rgba(20, 24, 28, .16);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181b; --surface: #1e2226; --fg: #eceae5; --muted: #9ba3ab; --line: #30363c;
    --accent: #e9774f; --chip: #2a2f34; --chip-on: #eceae5; --chip-on-fg: #15181b;
    --hat0: #8e99a6; --none: #6c737a; --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181b; --surface: #1e2226; --fg: #eceae5; --muted: #9ba3ab; --line: #30363c;
  --accent: #e9774f; --chip: #2a2f34; --chip-on: #eceae5; --chip-on-fg: #15181b;
  --hat0: #8e99a6; --none: #6c737a; --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-ui); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; }
#map { position: relative; min-height: 0; background: var(--bg); }

/* Top bar */
header {
  z-index: 1001; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 8px;
}
.bar { display: flex; gap: 8px; align-items: center; }
.brand { font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.brand small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
#q { flex: 1; min-width: 0; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.iconbtn { height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.iconbtn .count { background: var(--accent); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 6px; font-weight: 700; }
#filters { display: grid; gap: 8px; }
#filters[hidden] { display: none; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row > .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); width: 54px; flex: none; }
.chip { border: 0; background: var(--chip); padding: 5px 11px; border-radius: 99px; font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
select { height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); padding: 0 8px; max-width: 100%; }

/* List panel */
#panel {
  position: absolute; z-index: 1000; background: var(--surface); box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 0;
}
.panel-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.panel-head h2 { font-size: 14px; margin: 0; flex: 1; font-weight: 600; }
.panel-head h2 span { color: var(--muted); font-weight: 500; }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
#list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch; }
#list li button {
  width: 100%; text-align: left; border: 0; background: none; padding: 10px 14px; border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center;
}
#list li button:hover { background: var(--bg); }
#list .nm { font-weight: 600; display: block; }
#list .meta { color: var(--muted); font-size: 12.5px; display: block; }
#list .dist { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
#list .been { opacity: .5; }
.empty { padding: 24px 14px; color: var(--muted); }
#grab { display: none; }
#card, #fsheet { display: none; }

/* Restaurant card (phone) and filter sheet (phone) */
#card { overflow-y: auto; flex: 1; min-height: 0; padding: 2px 16px 16px; -webkit-overflow-scrolling: touch; }
#card .card-top { position: relative; padding-bottom: 12px; }
#card .card-more { border-top: 1px solid var(--line); padding-top: 12px; }
#card .pp h3 { margin-right: 44px; }
#card .x { position: absolute; top: 0; right: 0; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--chip); font-size: 15px; line-height: 1; }
#fsheet { flex-direction: column; flex: 1; min-height: 0; }
.fs-head { display: flex; align-items: center; gap: 8px; padding: 2px 16px 10px; border-bottom: 1px solid var(--line); }
.fs-head h2 { flex: 1; margin: 0; font-size: 16px; }
#f-clear { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 4px; }
#fslot { overflow-y: auto; flex: 1; min-height: 0; padding: 14px 16px; }
#fslot #filters { gap: 14px; }
.fs-foot { padding: 10px 16px; border-top: 1px solid var(--line); }
#f-apply { width: 100%; height: 46px; border: 0; border-radius: 12px; background: var(--chip-on); color: var(--chip-on-fg); font-weight: 700; }

/* Map control icons: icons + text on desktop, icons only on phones */
.ctl-btns button { display: flex; align-items: center; gap: 7px; }
.ctl-btns svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.legend .q { display: none; }

@media (max-width: 859px) {
  /* Map fills the screen; search and filter button float over it */
  #app { display: block; }
  #map { position: absolute; inset: 0; }
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1001; background: none; border: 0; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  }
  header .bar > * { pointer-events: auto; }
  .brand { display: none; }
  #q, #ftoggle { height: 44px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); border-color: transparent; }
  .leaflet-top { top: calc(env(safe-area-inset-top, 0px) + 62px); }
  .leaflet-control-zoom { display: none; }
  .ctl-btns button { padding: 10px; }
  .ctl-btns .t { display: none; }
  .legend .t { display: none; }
  .legend .q { display: inline; }
  .legend summary { width: 18px; text-align: center; }
  .leaflet-bottom { bottom: var(--sheet-h, 64px); }

  /* Bottom sheet: height set by script (peek / half / full, or card / filters) */
  .leaflet-control-attribution { font-size: 9.5px; }
  /* above Leaflet's control layer (z-index 1000) so the full-height sheet covers the map buttons */
  #panel { z-index: 1001; left: 0; right: 0; bottom: 0; height: var(--sheet-h, 64px); border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); overflow: hidden; transition: height .25s ease; }
  #panel.dragging { transition: none; }
  #grab { display: block; flex: none; width: 100%; border: 0; background: none; padding: 9px 0 7px; touch-action: none; cursor: grab; }
  #grab::before { content: ""; display: block; width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto; }
  .panel-head { padding-top: 0; touch-action: none; }
  #panel[data-mode="card"] #card { display: block; }
  #panel[data-mode="filters"] #fsheet { display: flex; }
  #panel:not([data-mode="list"]) .panel-head, #panel:not([data-mode="list"]) #list { display: none; }
  #card .card-top { touch-action: pan-x; }
}
@media (min-width: 860px) {
  #panel { top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; width: 340px; border-radius: 14px; overflow: hidden; }
  .leaflet-left .leaflet-control { margin-left: 364px; }
}
@media (prefers-reduced-motion: reduce) { #panel { transition: none; } }

/* Map controls and legend */
.ctl { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.ctl-btns { display: grid; overflow: hidden; }
.ctl-btns button { border: 0; background: none; padding: 8px 11px; font-size: 13px; font-weight: 600; text-align: left; }
.ctl-btns button + button { border-top: 1px solid var(--line); }
.legend { padding: 8px 10px; font-size: 12px; display: grid; gap: 6px; }
.legend .hd { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.legend .lr { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.legend .it { display: inline-flex; gap: 4px; align-items: center; }
.legend summary { cursor: pointer; font-weight: 600; list-style: none; }
.legend summary::-webkit-details-marker { display: none; }
/* OSM has no dark style: tone the light tiles down in dark mode */
@media (prefers-color-scheme: dark) { .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6); } }
.leaflet-control-attribution { background: var(--surface) !important; color: var(--muted) !important; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-bar a { background: var(--surface) !important; color: var(--fg) !important; border-color: var(--line) !important; }

/* Markers */
.mk { background: none; border: 0; }
.mk svg { overflow: visible; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
.mk.been { opacity: .42; }
.mk.hidden-mk { display: none; }
.cl { background: none; }
.cl div { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px;
  background: var(--fg); color: var(--bg); border: 3px solid var(--surface); box-shadow: var(--shadow); }

/* Popup */
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.leaflet-popup-content { margin: 14px 16px; font: 14px/1.45 var(--font-ui); width: min(300px, 72vw) !important; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.pp h3 { margin: 0 22px 2px 0; font-size: 17px; line-height: 1.2; text-wrap: balance; }
.pp .award { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 4px; }
.pp .stats { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pp .score { font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }
.pp .hl { font-family: var(--font-quote); font-style: italic; font-size: 16px; line-height: 1.35; margin: 8px 0; }
.pp .gtk { font-size: 13px; margin: 0 0 8px; }
.pp .gtk b { font-weight: 600; }
.pp .addr { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.pp .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.pp .acts a, .pp .acts button { font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-decoration: none; }
.pp .acts [aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
.pp .approx { font-size: 11.5px; color: var(--muted); margin: -6px 0 10px; }
</style>
</head>

const HAT_NAMES = ["No hat", "One hat", "Two hats", "Three hats"];
const PRICES = ["$", "$$", "$$$", "$$$$"];
const KEY = "gff100.marks.v1";  // shared by every page version on this site
// v1: colour = hats, shape = price.  v2: shape = hats, colour = price.
const MODE = "v2";
const PRICE_IDX = { "$": 0, "$$": 1, "$$$": 2, "$$$$": 3 };

/* ---------- personal marks (this browser only) ---------- */
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { marks = {}; }
const saveMarks = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} };
const mk = id => marks[id] || {};

/* ---------- state ---------- */
const st = { q: "", hats: new Set(), price: new Set(), cat: "", mark: "", sort: "rating", here: null };

/* ---------- marker icons ---------- */
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function shapePath(i) {
  switch (i) {
    case 0: return '<circle cx="16" cy="16" r="13"/>';
    case 1: return '<rect x="3.5" y="3.5" width="25" height="25" rx="6"/>';
    case 2: return '<path d="M16 1.5 30.5 16 16 30.5 1.5 16Z" stroke-linejoin="round"/>';
    case 3: return '<path d="M16 1.8 28.3 8.9V23.1L16 30.2 3.7 23.1V8.9Z" stroke-linejoin="round"/>';
    default: return '<path d="M16 30C16 30 5 19.5 5 12A11 11 0 0 1 27 12C27 19.5 16 30 16 30Z"/>';
  }
}
// shape index (-1 = plain pin for missing data) and fill token for a restaurant
function encode(r) {
  if (MODE === "v2") return r.price ? { shape: r.hats, fill: "--pr" + PRICE_IDX[r.price] } : { shape: -1 };
  return r.price && r.score != null ? { shape: PRICE_IDX[r.price], fill: "--hat" + r.hats } : { shape: -1 };
}
function svgFor(r, size = 32) {
  const e = encode(r), known = e.shape >= 0;
  const fill = known ? css(e.fill) : "none";
  const stroke = known ? css("--surface") : css("--none");
  const label = r.score != null ? (Number.isInteger(r.score) ? r.score : r.score.toFixed(1)) : "–";
  const fs = String(label).length > 2 ? 9.5 : 11;
  const txt = known ? "#fff" : css("--muted");
  const star = mk(r.id).want
    ? '<g transform="translate(22 -4)"><circle cx="6" cy="6" r="7" fill="' + css("--surface") + '"/><path d="M6 1.2l1.45 2.95 3.25.47-2.35 2.3.55 3.24L6 8.63 3.1 10.16l.55-3.24L1.3 4.62l3.25-.47Z" fill="' + css("--accent") + '"/></g>'
    : "";
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 32 32"><g fill="' + fill + '" stroke="' + stroke + '" stroke-width="2.2">' +
    shapePath(e.shape) + '</g><text x="16" y="' + (known ? 16 : 13) + '" text-anchor="middle" dominant-baseline="central" font-family="Instrument Sans, system-ui, sans-serif" font-weight="700" font-size="' + fs + '" fill="' + txt + '">' + label + "</text>" + star + "</svg>";
}
function iconFor(r) {
  const pin = encode(r).shape < 0;
  return L.divIcon({ className: "mk" + (mk(r.id).been ? " been" : ""), html: svgFor(r), iconSize: [32, 32], iconAnchor: pin ? [16, 30] : [16, 16], popupAnchor: [0, -14] });
}

/* ---------- map ---------- */
const map = L.map("map", { zoomControl: false, attributionControl: true, tap: true });
L.control.zoom({ position: "topright" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Reviews: SMH Good Food Guide'
}).addTo(map);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refreshIcons);

const cluster = L.markerClusterGroup({
  disableClusteringAtZoom: 15, maxClusterRadius: 44, showCoverageOnHover: false, spiderfyOnMaxZoom: true,
  iconCreateFunction: c => L.divIcon({ className: "cl", html: "<div>" + c.getChildCount() + "</div>", iconSize: [38, 38] })
});
map.addLayer(cluster);

const byId = new Map();
for (const r of DATA) {
  if (r.lat == null) continue;
  const m = L.marker([r.lat, r.lon], { icon: iconFor(r), title: r.name, riseOnHover: true });
  m.on("click", () => narrow() ? openCard(r) : openPopup(r));
  byId.set(r.id, { r, m });
}
function refreshIcon(id) { const o = byId.get(id); if (o) o.m.setIcon(iconFor(o.r)); }
function refreshIcons() { for (const id of byId.keys()) refreshIcon(id); }

const SYD = L.latLngBounds([-34.12, 150.85], [-33.70, 151.32]);
// keep fitted views clear of the side panel (wide) or bottom sheet (phone)
const fitPad = () => matchMedia("(min-width: 860px)").matches
  ? { paddingTopLeft: [370, 30], paddingBottomRight: [30, 30] }
  : { paddingTopLeft: [20, hdrBottom()], paddingBottomRight: [20, sheetPx() + 12] };
function showSydney() { map.fitBounds(SYD, fitPad()); }
function showAll() {
  const pts = [...byId.values()].map(o => o.m.getLatLng());
  if (pts.length) map.fitBounds(L.latLngBounds(pts), fitPad());
}
showSydney();

const Ctl = L.Control.extend({
  onAdd() {
    const d = L.DomUtil.create("div", "ctl ctl-btns");
    const ic = p => '<svg viewBox="0 0 24 24" aria-hidden="true">' + p + "</svg>";
    d.innerHTML =
      '<button type="button" id="b-all" aria-label="Show all 100" title="Show all 100">' + ic('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>') + '<span class="t">Show all 100</span></button>' +
      '<button type="button" id="b-syd" aria-label="Sydney" title="Sydney">' + ic('<path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>') + '<span class="t">Sydney</span></button>' +
      '<button type="button" id="b-me" aria-label="Near me" title="Near me">' + ic('<path d="M3 11l18-8-8 18-2-8z"/>') + '<span class="t">Near me</span></button>';
    L.DomEvent.disableClickPropagation(d);
    return d;
  }
});
new Ctl({ position: "topright" }).addTo(map);

const Legend = L.Control.extend({
  onAdd() {
    const d = L.DomUtil.create("details", "ctl legend");
    const swatch = (v, label) => '<span class="it"><span class="chip sw" style="background:var(' + v + ')"></span>' + label + "</span>";
    const shapes = labels => labels.map((l, i) => '<span class="it">' + legendShape(i) + l + "</span>").join("");
    d.innerHTML = '<summary aria-label="Legend"><span class="t">Legend</span><span class="q" aria-hidden="true">?</span></summary>' + (MODE === "v2"
      ? '<div class="hd">Shape · hats</div><div class="lr">' + shapes(["0", "1", "2", "3"]) + "</div>" +
        '<div class="hd">Colour · price</div><div class="lr">' + PRICES.map((p, i) => swatch("--pr" + i, p)).join("") + "</div>"
      : '<div class="hd">Colour · hats</div><div class="lr">' + [0, 1, 2, 3].map(h => swatch("--hat" + h, h)).join("") + "</div>" +
        '<div class="hd">Shape · price</div><div class="lr">' + shapes(PRICES) + "</div>") +
      '<div class="hd">Number · score /20</div><div class="lr"><span class="it">' + legendShape(-1) + (MODE === "v2" ? 'No price' : 'No score or price') + '</span></div>' +
      '<div class="lr"><span class="it" style="opacity:.45">Faded = been</span><span class="it">★ = want to go</span></div>';
    L.DomEvent.disableClickPropagation(d);
    if (matchMedia("(min-width: 860px)").matches) d.open = true;
    return d;
  }
});
function legendShape(i) {
  const fill = i >= 0 ? css("--muted") : "none", stroke = i >= 0 ? css("--surface") : css("--none");
  return '<svg width="16" height="16" viewBox="0 0 32 32"><g fill="' + fill + '" stroke="' + stroke + '" stroke-width="2.5">' + shapePath(i) + "</g></svg>";
}
new Legend({ position: "bottomright" }).addTo(map);

/* ---------- popups ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function popupHtml(r) {
  const m = mk(r.id);
  const gtk = r.tip ? (r.tipLabel ? "<b>" + esc(r.tipLabel) + ":</b> " : "<b>Good to know:</b> ") + esc(r.tip) : "";
  const dest = encodeURIComponent(r.name + ", " + (r.address || ""));
  return '<div class="pp">' +
    (r.award ? '<div class="award">' + esc(r.award) + "</div>" : "") +
    "<h3>" + esc(r.name) + "</h3>" +
    '<div class="stats">' + (r.score != null ? '<span class="score">' + esc(r.score) + "/20</span>" : "") +
    "<span>" + esc(HAT_NAMES[r.hats]) + "</span>" + (r.price ? "<span>" + esc(r.price) + "</span>" : "") +
    (r.category ? "<span>" + esc(r.category) + "</span>" : "") + "</div>" +
    (r.headline ? '<p class="hl">' + esc(r.headline) + "</p>" : "") +
    (gtk ? '<p class="gtk">' + gtk + "</p>" : "") +
    '<p class="addr">' + esc(r.address || "") + "</p>" +
    (r.approx ? '<p class="approx">Pin position is approximate.</p>' : "") +
    '<div class="acts">' +
    '<a href="https://www.google.com/maps/dir/?api=1&destination=' + dest + '" target="_blank" rel="noopener">Directions</a>' +
    (r.website ? '<a href="' + esc(r.website) + '" target="_blank" rel="noopener">Website</a>' : "") +
    '<button type="button" data-k="want" aria-pressed="' + !!m.want + '">★ Want to go</button>' +
    '<button type="button" data-k="been" aria-pressed="' + !!m.been + '">✓ Been</button>' +
    "</div></div>";
}
// desktop: floating popup over the map
function openPopup(r) {
  const o = byId.get(r.id), pin = encode(r).shape < 0;
  const p = L.popup({ maxWidth: 320, autoPanPaddingTopLeft: [20, 80], offset: [0, pin ? -26 : -12] })
    .setLatLng(o.m.getLatLng()).setContent(popupHtml(r)).openOn(map);
  wireMarks(p.getElement(), r);
}
// phone: card in the bottom sheet; summary on top, details below the fold
function cardHtml(r) {
  const m = mk(r.id);
  const gtk = r.tip ? (r.tipLabel ? "<b>" + esc(r.tipLabel) + ":</b> " : "<b>Good to know:</b> ") + esc(r.tip) : "";
  const dest = encodeURIComponent(r.name + ", " + (r.address || ""));
  return '<div class="pp"><div class="card-top">' +
    '<button type="button" class="x" aria-label="Close">✕</button>' +
    (r.award ? '<div class="award">' + esc(r.award) + "</div>" : "") +
    "<h3>" + esc(r.name) + "</h3>" +
    '<div class="stats">' + (r.score != null ? '<span class="score">' + esc(r.score) + "/20</span>" : "") +
    "<span>" + esc(HAT_NAMES[r.hats]) + "</span>" + (r.price ? "<span>" + esc(r.price) + "</span>" : "") +
    (r.category ? "<span>" + esc(r.category) + "</span>" : "") + "</div>" +
    (r.headline ? '<p class="hl">' + esc(r.headline) + "</p>" : "") +
    '<div class="acts">' +
    '<a href="https://www.google.com/maps/dir/?api=1&destination=' + dest + '" target="_blank" rel="noopener">Directions</a>' +
    (r.website ? '<a href="' + esc(r.website) + '" target="_blank" rel="noopener">Website</a>' : "") +
    '<button type="button" data-k="want" aria-pressed="' + !!m.want + '">★ Want to go</button>' +
    '<button type="button" data-k="been" aria-pressed="' + !!m.been + '">✓ Been</button>' +
    "</div></div>" +
    '<div class="card-more">' + (gtk ? '<p class="gtk">' + gtk + "</p>" : "") +
    '<p class="addr">' + esc(r.address || "") + "</p>" +
    (r.approx ? '<p class="approx">Pin position is approximate.</p>' : "") + "</div></div>";
}
function wireMarks(root, r) {
  root.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.k, cur = { ...mk(r.id) };
    cur[k] = !cur[k];
    if (!cur.want && !cur.been) delete marks[r.id]; else marks[r.id] = cur;
    saveMarks();
    b.setAttribute("aria-pressed", String(!!cur[k]));
    refreshIcon(r.id);
    render(false);
  }));
}

/* ---------- filters UI ---------- */
function chip(parent, label, onToggle, swatch) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", "false");
  b.innerHTML = (swatch ? '<span class="sw" style="background:' + swatch + '"></span>' : "") + esc(label);
  b.addEventListener("click", () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); onToggle(on); render(true); });
  parent.appendChild(b); return b;
}
const fH = document.getElementById("f-hats");
[0, 1, 2, 3].forEach(h => chip(fH, String(h), on => on ? st.hats.add(h) : st.hats.delete(h), MODE === "v2" ? null : "var(--hat" + h + ")"));
const fP = document.getElementById("f-price");
PRICES.forEach((p, i) => chip(fP, p, on => on ? st.price.add(p) : st.price.delete(p), MODE === "v2" ? "var(--pr" + i + ")" : null));
const fM = document.getElementById("f-mark");
const markChips = [["want", "★ Want to go"], ["been", "✓ Been"], ["notbeen", "Not been"]].map(([k, l]) => {
  const b = chip(fM, l, on => {
    st.mark = on ? k : "";
    markChips.forEach(o => { if (o !== b) o.setAttribute("aria-pressed", "false"); });
  });
  return b;
});
const cats = {};
DATA.forEach(r => { if (r.category) cats[r.category] = (cats[r.category] || 0) + 1; });
const sel = document.getElementById("f-cat");
Object.keys(cats).sort().forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = c + " (" + cats[c] + ")"; sel.appendChild(o); });
sel.addEventListener("change", () => { st.cat = sel.value; render(true); });
document.getElementById("q").addEventListener("input", e => { st.q = e.target.value.trim().toLowerCase(); render(true); });
const ft = document.getElementById("ftoggle"), fbox = document.getElementById("filters");
ft.addEventListener("click", () => {
  if (narrow()) { sheet.mode === "filters" ? closeFilters() : openFilters(); return; }
  fbox.hidden = !fbox.hidden; ft.setAttribute("aria-expanded", String(!fbox.hidden)); setTimeout(() => map.invalidateSize(), 50);
});
function clearFilters() {
  st.hats.clear(); st.price.clear(); st.cat = ""; st.mark = "";
  fbox.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
  sel.value = "";
  render(false);
}
document.getElementById("f-clear").addEventListener("click", clearFilters);
document.getElementById("f-apply").addEventListener("click", () => closeFilters());

/* ---------- sorting / location ---------- */
const sR = document.getElementById("s-rating"), sN = document.getElementById("s-near");
function setSort(s) { st.sort = s; sR.setAttribute("aria-pressed", String(s === "rating")); sN.setAttribute("aria-pressed", String(s === "near")); render(false); }
sR.addEventListener("click", () => setSort("rating"));
let hereMarker = null;
function locate(then) {
  if (!navigator.geolocation) { alertSoft("Location isn't available in this browser."); return; }
  navigator.geolocation.getCurrentPosition(p => {
    st.here = L.latLng(p.coords.latitude, p.coords.longitude);
    if (!hereMarker) hereMarker = L.circleMarker(st.here, { radius: 7, color: "#fff", weight: 3, fillColor: "#2a7de1", fillOpacity: 1 }).addTo(map);
    else hereMarker.setLatLng(st.here);
    then && then();
  }, () => alertSoft("Couldn't get your location. Check that location access is allowed for this site."), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}
function alertSoft(msg) { const l = document.getElementById("list"); l.insertAdjacentHTML("afterbegin", '<li class="empty">' + esc(msg) + "</li>"); }
sN.addEventListener("click", () => st.here ? setSort("near") : locate(() => setSort("near")));
document.addEventListener("click", e => {
  const id = e.target.closest("button")?.id;
  if (id === "b-all") showAll();
  if (id === "b-syd") showSydney();
  if (id === "b-me") locate(() => { map.setView(st.here, 14); setSort("near"); });
});

/* ---------- panel: side panel on desktop, bottom sheet on phones ---------- */
function narrow() { return matchMedia("(max-width: 859px)").matches; }  // hoisted: fitPad() runs before this point
const panel = document.getElementById("panel");
const grab = document.getElementById("grab"), listHead = document.getElementById("list-head");
const cardEl = document.getElementById("card"), fslot = document.getElementById("fslot");
L.DomEvent.disableClickPropagation(panel); L.DomEvent.disableScrollPropagation(panel);

// mode: list | card | filters. listState: peek | half | full. cardState: compact | expanded.
const sheet = { mode: "list", listState: "peek", cardState: "compact", returnTo: "peek", card: null };
function hdrBottom() { return Math.round(document.querySelector("header").getBoundingClientRect().bottom) + 8; }
function sheetPx() { return narrow() ? Math.round(document.getElementById("panel").getBoundingClientRect().height) : 0; }
function snaps() {
  const H = document.getElementById("map").clientHeight;
  const safeB = parseFloat(getComputedStyle(panel).paddingBottom) || 0;
  const full = H - hdrBottom(), g = grab.offsetHeight + safeB;
  if (sheet.mode === "card") {
    const top = cardEl.querySelector(".card-top");
    const compact = Math.min(g + (top ? top.offsetHeight : 160) + 4, full);
    return { compact, expanded: Math.max(compact, Math.min(g + cardEl.scrollHeight + 4, full)) };
  }
  if (sheet.mode === "filters") return { full };
  return { peek: g + listHead.offsetHeight, half: Math.round(H * 0.5), full };
}
const stateKey = () => sheet.mode === "card" ? sheet.cardState : sheet.mode === "filters" ? "full" : sheet.listState;
function setHeight(px) {
  panel.style.height = px + "px";
  document.documentElement.style.setProperty("--sheet-h", px + "px");
}
function applySheet() {
  if (!narrow()) return;
  panel.dataset.mode = sheet.mode;
  requestAnimationFrame(() => { setHeight(snaps()[stateKey()]); renderList(); });
}

// Drag the sheet by its handle or list header; a tap on the handle steps through the heights
let drag = null;
panel.addEventListener("pointerdown", e => {
  if (!narrow()) return;
  const onHandle = e.target === grab || (listHead.contains(e.target) && !e.target.closest("button")) ||
    (sheet.mode === "card" && e.target.closest(".card-top") && !e.target.closest("a, button"));
  if (!onHandle) return;
  drag = { onGrab: e.target === grab, y0: e.clientY, h0: panel.getBoundingClientRect().height, t0: e.timeStamp, y: e.clientY, t: e.timeStamp, moved: false, id: e.pointerId };
  panel.setPointerCapture(e.pointerId);
});
panel.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dy = e.clientY - drag.y0;
  if (!drag.moved && Math.abs(dy) < 6) return;
  drag.moved = true; panel.classList.add("dragging");
  drag.v = (e.clientY - drag.y) / Math.max(1, e.timeStamp - drag.t); drag.y = e.clientY; drag.t = e.timeStamp;
  const full = document.getElementById("map").clientHeight - hdrBottom();
  setHeight(Math.max(40, Math.min(full, drag.h0 - dy)));
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  panel.classList.remove("dragging");
  if (!d.moved) { if (d.onGrab) stepSheet(); return; }
  const h = panel.getBoundingClientRect().height - (d.v || 0) * 180;  // project a flick forward
  const s = snaps();
  if (sheet.mode === "card" && h < s.compact - 50) return closeCard();
  if (sheet.mode === "filters" && h < s.full * 0.75) return closeFilters();
  const best = Object.entries(s).sort((a, b) => Math.abs(a[1] - h) - Math.abs(b[1] - h))[0][0];
  if (sheet.mode === "card") sheet.cardState = best; else if (sheet.mode === "list") sheet.listState = best;
  applySheet();
}
panel.addEventListener("pointerup", endDrag);
panel.addEventListener("pointercancel", endDrag);
function stepSheet() {
  if (sheet.mode === "card") sheet.cardState = sheet.cardState === "compact" ? "expanded" : "compact";
  else if (sheet.mode === "list") sheet.listState = { peek: "half", half: "full", full: "peek" }[sheet.listState];
  applySheet();
}

// Pan so a restaurant sits in the middle of the map area left visible above the sheet
function focusOn(r, sheetH) {
  const z = Math.max(map.getZoom(), 15), size = map.getSize();
  const top = hdrBottom(), wantY = (top + (size.y - sheetH)) / 2;
  const pt = map.project([r.lat, r.lon], z).add([0, size.y / 2 - wantY]);
  map.setView(map.unproject(pt, z), z);
}
function openCard(r) {
  if (sheet.mode === "list") sheet.returnTo = sheet.listState;
  if (sheet.mode === "filters") sheet.returnTo = "half";
  sheet.mode = "card"; sheet.cardState = "compact"; sheet.card = r;
  panel.dataset.mode = "card";
  cardEl.innerHTML = cardHtml(r);
  cardEl.scrollTop = 0;
  wireMarks(cardEl, r);
  cardEl.querySelector(".x").addEventListener("click", closeCard);
  requestAnimationFrame(() => {
    const h = snaps().compact;
    setHeight(h);
    focusOn(r, h);
  });
}
function closeCard() {
  if (sheet.mode !== "card") return;
  sheet.mode = "list"; sheet.listState = sheet.returnTo; sheet.card = null;
  applySheet();
}
function openFilters() {
  if (sheet.mode === "list") sheet.returnTo = sheet.listState;
  sheet.mode = "filters"; ft.setAttribute("aria-expanded", "true");
  applySheet();
}
function closeFilters() {
  sheet.mode = "list"; sheet.listState = "half"; ft.setAttribute("aria-expanded", "false");
  applySheet();
  setTimeout(() => refitShown(), 280);
}
map.on("click", () => { if (narrow()) closeCard(); });
map.on("moveend", () => { if (narrow() && sheet.mode === "list") renderList(); });
document.getElementById("q").addEventListener("focus", () => {
  if (!narrow()) return;
  if (sheet.mode !== "list") { sheet.mode = "list"; sheet.listState = "half"; applySheet(); }
  else if (sheet.listState === "peek") { sheet.listState = "half"; applySheet(); }
});

// Filters live in the header on desktop and in the sheet on phones
function placeLayout() {
  if (narrow()) {
    if (fbox.parentNode !== fslot) fslot.appendChild(fbox);
    fbox.hidden = false;
    applySheet();
  } else {
    if (fbox.parentNode !== document.querySelector("header")) document.querySelector("header").appendChild(fbox);
    fbox.hidden = ft.getAttribute("aria-expanded") !== "true";
    sheet.mode = "list"; panel.dataset.mode = "list";
    panel.style.height = ""; document.documentElement.style.removeProperty("--sheet-h");
    renderList();
  }
}
matchMedia("(max-width: 859px)").addEventListener("change", () => { ft.setAttribute("aria-expanded", "false"); placeLayout(); });
addEventListener("resize", () => { if (narrow()) applySheet(); });

/* ---------- render ---------- */
function matches(r) {
  if (st.hats.size && !st.hats.has(r.hats)) return false;
  if (st.price.size && !st.price.has(r.price)) return false;
  if (st.cat && r.category !== st.cat) return false;
  const m = mk(r.id);
  if (st.mark === "want" && !m.want) return false;
  if (st.mark === "been" && !m.been) return false;
  if (st.mark === "notbeen" && m.been) return false;
  if (st.q && !r.search.includes(st.q)) return false;
  return true;
}
function fmtKm(m) { return m < 1000 ? Math.round(m / 10) * 10 + " m" : (m / 1000).toFixed(m < 10000 ? 1 : 0) + " km"; }
let shown = [];
// lat/lng box of the map area the user can actually see (between the search bar and the sheet)
function visibleBounds() {
  const size = map.getSize();
  return L.latLngBounds(map.containerPointToLatLng([0, hdrBottom()]), map.containerPointToLatLng([size.x, size.y - sheetPx()]));
}
function render(refit) {
  shown = DATA.filter(r => r.lat != null && matches(r));
  cluster.clearLayers();
  cluster.addLayers(shown.map(r => byId.get(r.id).m));
  const n = st.hats.size + st.price.size + (st.cat ? 1 : 0) + (st.mark ? 1 : 0);
  const fc = document.getElementById("fcount"); fc.hidden = !n; fc.textContent = n;
  document.getElementById("f-apply").textContent = shown.length ? "Show " + shown.length + " restaurant" + (shown.length === 1 ? "" : "s") : "No matches";
  renderList();
  if (refit) refitShown();
}
function refitShown() {
  const n = st.hats.size + st.price.size + (st.cat ? 1 : 0) + (st.mark ? 1 : 0);
  if (shown.length && (st.q || n) && !(narrow() && sheet.mode === "filters"))
    map.fitBounds(L.latLngBounds(shown.map(r => [r.lat, r.lon])), { ...fitPad(), maxZoom: 15 });
}
function renderList() {
  // phones: at peek/half the list follows the map; at full height it lists every match
  const inView = narrow() && sheet.mode === "list" && sheet.listState !== "full";
  const vb = inView ? visibleBounds() : null;
  const pool = inView ? shown.filter(r => vb.contains([r.lat, r.lon])) : shown;
  document.getElementById("shown").textContent = inView
    ? "· " + pool.length + " in view"
    : shown.length === DATA.length ? "· all " + shown.length : "· " + shown.length + " of " + DATA.length;
  const rows = pool.map(r => ({ r, d: st.here ? st.here.distanceTo([r.lat, r.lon]) : null }));
  if (st.sort === "near" && st.here) rows.sort((a, b) => a.d - b.d);
  else rows.sort((a, b) => (b.r.score ?? -1) - (a.r.score ?? -1) || a.r.name.localeCompare(b.r.name));
  const list = document.getElementById("list");
  list.innerHTML = rows.length ? rows.map(({ r, d }) =>
    '<li><button type="button" data-id="' + esc(r.id) + '" class="' + (mk(r.id).been ? "been" : "") + '">' + svgFor(r, 30) +
    '<span><span class="nm">' + esc(r.name) + "</span>" +
    '<span class="meta">' + [r.category, HAT_NAMES[r.hats], r.price, r.suburb].filter(Boolean).map(esc).join(" · ") + "</span></span>" +
    '<span class="dist">' + (d != null ? fmtKm(d) : "") + "</span></button></li>").join("")
    : '<li class="empty">' + (inView && shown.length ? "No restaurants in this part of the map. Zoom out or drag the list up to see all." : "No restaurants match these filters.") + "</li>";
}
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]"); if (!b) return;
  const o = byId.get(b.dataset.id); if (!o) return;
  if (narrow()) return openCard(o.r);
  cluster.zoomToShowLayer(o.m, () => { map.panTo(o.m.getLatLng()); openPopup(o.r); });
});
render(false);
placeLayout();
</script>
</body>
</html>
